<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Евгений Исаев — Director of Engineering / Head of Engineering / CTO</title>
<meta name="description" content="Резюме Евгения Исаева: Director of Engineering, Head of Engineering и CTO с 16-летним опытом в разработке ПО.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/casualwriter/casual-markdown/dist/casual-markdown.css">
<script src="https://cdn.jsdelivr.net/gh/casualwriter/casual-markdown/dist/casual-markdown.js"></script>
<style>
body{line-height:1.5;margin:auto;padding:12px;max-width:1024px;font-family:Arial,Helvetica Neue,sans-serif;font-size:14px}
h1{font-size:200%}
h2{border-bottom:1px solid grey;padding:2px}
.resume-header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin:8px 0 20px}
.resume-heading{flex:1;min-width:280px}
.resume-heading h1{margin:0 0 6px;line-height:1.15}
.resume-role{font-size:200%;font-weight:700;line-height:1.2}
.resume-meta{display:flex;align-items:flex-start;gap:12px;flex:0 0 auto}
.resume-contact{text-align:right;white-space:nowrap}
.resume-avatar{border-radius:50%;width:80px;height:80px;object-fit:cover}
@media(max-width:640px){.resume-header{flex-direction:column;gap:16px}.resume-meta{width:100%;justify-content:space-between}.resume-contact{text-align:left}.resume-avatar{width:72px;height:72px}}
</style>
</head>
<body>
<script>
fetch('resume_ru.md').then(r=>r.text()).then(t=>{document.body.innerHTML=md.html(t)});
</script>
</body>
</html>
